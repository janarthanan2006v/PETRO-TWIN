version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petro-twin-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./petro_twin.db
      - PROJECT_NAME=PETRO-TWIN
    volumes:
      - backend-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petro-twin-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
